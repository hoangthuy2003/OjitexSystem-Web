<section class="department-page">
  @if (isReport) {
    <header class="page-heading">
      <h1>REPORT MENU</h1>
    </header>
    <div class="report-grid" aria-label="Report menu">
      @for (item of reportItems; track item.name) {
        <button class="report-card" type="button" (click)="openReportItem(item)">
          {{ item.name }}
        </button>
      }
    </div>
  } @else if (isFactory) {
    <header class="page-heading">
      <h1>FACTORY MENU</h1>
    </header>
    <div class="report-grid" aria-label="Factory menu">
      @for (item of factoryItems; track item.name + item.detail) {
        <button
          class="report-card factory-card"
          type="button"
          [disabled]="!item.route"
          [title]="item.route ? item.name + ' ' + item.detail : 'Feature in Development'"
          (click)="openReportItem(item)"
        >
          {{ item.name }} {{ item.detail }}
        </button>
      }
    </div>
  } @else {
    <header class="page-heading">
      <h1>{{ department }} MENU</h1>
    </header>
    <div class="report-grid" aria-label="Department menu">
      <button class="report-card" type="button" disabled>Feature in Development</button>
    </div>
  }
  <a class="back-button" routerLink="/home">Go Back</a>
</section>
