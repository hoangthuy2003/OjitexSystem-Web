@if (isAuthenticated) {
  <header class="app-header">
    <a class="brand" routerLink="/home" aria-label="Go to the Ojitex System home page">
      <img src="/logo.png" alt="" />
    </a>
    <a class="system-title" routerLink="/home">Ojitex System</a>
    <div class="user-menu">
      <button class="user-button" type="button" aria-label="User account">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5"></circle>
          <path d="M4.5 20c.5-4 3-6 7.5-6s7 2 7.5 6"></path>
        </svg>
      </button>
      <div class="user-popover">
        <span class="user-name">{{ currentUserName }}</span>
        <button class="change-password-button" type="button" (click)="openChangePassword()">
          Change password
        </button>
        <button type="button" (click)="logout()">Sign out</button>
      </div>
    </div>
  </header>
}

@if (passwordChangeNotice) {
  <p class="password-toast" role="status">{{ passwordChangeNotice }}</p>
}

<main class="app-content">
  <router-outlet />
</main>

@if (changePasswordOpen) {
  <div
    class="password-dialog-backdrop"
    (click)="closeChangePasswordFromBackdrop($event)"
    (keydown.escape)="closeChangePassword()"
  >
    <section
      class="password-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="change-password-heading"
      tabindex="-1"
    >
      <div class="password-dialog-heading">
        <div>
          <p class="password-dialog-eyebrow">ACCOUNT SECURITY</p>
          <h2 id="change-password-heading">Change password</h2>
        </div>
        <button
          class="password-dialog-close"
          type="button"
          aria-label="Close change password form"
          [disabled]="changingPassword"
          (click)="closeChangePassword()"
        >
          ×
        </button>
      </div>

      @if (passwordChangeError) {
        <p class="password-dialog-error" role="alert">{{ passwordChangeError }}</p>
      }

      <form (ngSubmit)="submitChangePassword()">
        <label class="password-field">
          <span>Current password</span>
          <input
            type="password"
            name="currentPassword"
            [(ngModel)]="currentPassword"
            autocomplete="current-password"
            autofocus
            required
          />
        </label>
        <label class="password-field">
          <span>New password</span>
          <input
            type="password"
            name="newPassword"
            [(ngModel)]="newPassword"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </label>
        <label class="password-field">
          <span>Confirm new password</span>
          <input
            type="password"
            name="confirmNewPassword"
            [(ngModel)]="confirmNewPassword"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </label>
        <p class="password-dialog-hint">Use at least 8 characters for your new password.</p>
        <div class="password-dialog-actions">
          <button
            class="password-secondary-button"
            type="button"
            [disabled]="changingPassword"
            (click)="closeChangePassword()"
          >
            Cancel
          </button>
          <button class="password-submit-button" type="submit" [disabled]="changingPassword">
            {{ changingPassword ? 'Changing...' : 'Change password' }}
          </button>
        </div>
      </form>
    </section>
  </div>
}
