<section class="home-page">
  <div class="welcome">
  </div>
  <nav class="department-grid" aria-label="Departments">
    @for (department of departments; track department.slug) {
      @if (department.slug === 'admin') {
        <button class="department-card" type="button" (click)="openDepartment($event, department)">
          <span>{{ department.name }}</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14m-6-6 6 6-6 6"></path>
          </svg>
        </button>
      } @else {
        <a class="department-card" [routerLink]="['/department', department.slug]">
          <span>{{ department.name }}</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14m-6-6 6 6-6 6"></path>
          </svg>
        </a>
      }
    }
  </nav>
</section>

@if (adminAccessDialogOpen) {
  <div
    class="admin-access-backdrop"
    (click)="closeAdminAccessDialogFromBackdrop($event)"
    (keydown.escape)="closeAdminAccessDialog()"
  >
    <section
      class="admin-access-dialog"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="admin-access-heading"
      aria-describedby="admin-access-message"
      tabindex="-1"
    >
      <div class="admin-access-icon" aria-hidden="true">!</div>
      <h2 id="admin-access-heading">Access denied</h2>
      <p id="admin-access-message">Bạn không có quyền truy cập tính năng này.</p>
      <button type="button" (click)="closeAdminAccessDialog()">Đóng</button>
    </section>
  </div>
}
