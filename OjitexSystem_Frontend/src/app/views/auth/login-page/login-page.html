<main class="login-page">
  <section class="company-panel" aria-label="Ojitex factory">
    <img class="company-image" src="/company-factory.png" alt="Ojitex factory in Hai Phong" />
    <div class="image-shade"></div>
    <div class="company-caption">
      <span class="company-label">OJITEX SYSTEM</span>
      <h1>We Provide The Best<br />Packaging Solutions</h1>

      <span class="caption-rule" aria-hidden="true"></span>
    </div>
  </section>

  <section class="form-panel" aria-labelledby="login-heading">
    <div class="login-card">
      <div class="logo-container">
        <img src="/logo.png" alt="Ojitex System" />
      </div>
      <p class="eyebrow">OJITEX SYSTEM</p>
      <h2 id="login-heading">Sign In</h2>
      <br />
      <form class="login-form" (ngSubmit)="submitLogin()">
        <label class="field-label" for="username">Username</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M5 20c.5-3.5 3-5.5 7-5.5s6.5 2 7 5.5"></path>
          </svg>
          <input
            id="username"
            name="username"
            type="text"
            [(ngModel)]="username"
            autocomplete="username"
            required
          />
        </div>

        <label class="field-label password-label" for="password">Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4.5" y="10" width="15" height="10" rx="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            <path d="M12 14v2"></path>
          </svg>
          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            autocomplete="current-password"
            required
          />
          <button
            class="visibility-button"
            type="button"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
            (click)="showPassword = !showPassword"
          >
            @if (showPassword) {
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c5.5 0 9 7 9 7a15 15 0 0 1-3.1 3.8"></path>
                <path d="M6.2 6.2C3.9 7.8 3 12 3 12s3.5 7 9 7a10 10 0 0 0 3-.5"></path>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 12s3.5-7 9-7 9 7 9 7-3.5 7-9 7-9-7-9-7Z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
              </svg>
            }
          </button>
        </div>

        <label class="remember-option">
          <input name="rememberMe" type="checkbox" [(ngModel)]="rememberMe" />
          <span>Remember me</span>
        </label>

        <button class="submit-button" type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Signing in...' : 'Sign In' }}
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>
        </button>

        @if (statusMessage) {
          <p
            class="status-message"
            [class.status-success]="statusType === 'success'"
            role="status"
            aria-live="polite"
          >
            {{ statusMessage }}
          </p>
        }
      </form>
    </div>
  </section>
</main>
